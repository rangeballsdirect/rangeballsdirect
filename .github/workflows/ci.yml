name: CI

# Vercel builds and deploys this site from the same repo. This workflow is the
# quality gate only — it must never publish, or the site would exist at two
# origins and compete with itself in search.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx astro check
      - name: Install Chromium
        run: npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Build and verify
        run: npm test
